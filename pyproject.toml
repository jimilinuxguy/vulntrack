[project]
name = "vulntrack"
version = "0.1.0"
description = "Multi-tenant vulnerability tracking and remediation platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3", "pydantic-settings>=2,<3", "httpx>=0.27,<1", "pyjwt[crypto]>=2.9,<3", "python-multipart>=0.0.9", "psycopg[binary]>=3.2,<4"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
[tool.pytest.ini_options]
testpaths=["tests"]
